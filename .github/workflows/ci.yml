name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases on tag pushes
  packages: read    # to pull the prebuilt toolchain image (see .ci/toolchain_image.sh)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The prebuilt toolchain image, when there is one, is published under the
      # repo owner's namespace, so the pull needs a login. Not fatal: without it
      # the next step just builds the image from .ci/Dockerfile, as always.
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "::warning::ghcr.io login failed; the toolchain image will be built locally"

      # Provide the reproducible toolchain image (devkitPPC + pinned libogc2/libfat):
      # pull the pinned prebuilt one if .ci/toolchain.digest says so and it still
      # matches .ci/Dockerfile, otherwise build it here exactly as CI always did.
      # Every step below runs `docker run ... cubiboot-dev` either way.
      - name: Provide the cubiboot-dev image
        run: bash .ci/toolchain_image.sh

      # The version shown under the banner, on the menu cube and on the .iso BIOS intro.
      # Stamped from the tag being built so a release cannot ship the previous version's
      # number; off a tag there is no version to claim, so the commit is used instead --
      # which is also what you want when someone reports a bug against a test build.
      # Both artefacts read this one file: build_iso.sh's brand_gbi.py copies its text
      # across, so stamping here covers the .iso too.
      - name: Stamp the banner version
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          python3 .ci/brand_opening.py patches/data/default_opening.bin "$VERSION"
          # The menu watermark shows the same id (patches/Makefile reads CUBIBOOT_VERSION).
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ipl.dol: the cubeboot loader (entry/ build copies emu sources + compresses payload).
      - name: Build ipl.dol
        run: docker run --rm -v "$PWD":/work -e CUBIBOOT_VERSION="$VERSION" cubiboot-dev bash -lc 'cd entry && make clean && make'

      # apploader.img: Swiss IGR redirect embedding the freshly built cubeboot loader.
      - name: Build apploader.img
        run: docker run --rm -v "$PWD":/work cubiboot-dev bash -lc 'bash /work/.ci/build_apploader.sh'

      # build_apploader.sh takes the Swiss packer from swiss-gc's HEAD on purpose
      # (the IGR stub has to follow Swiss), so every build says which commit that
      # was: here in the log and the job summary, and on a tag in the release notes
      # below. A report of "In-Game Reset stopped working" then names a Swiss commit
      # instead of a date.
      - name: Record the swiss-gc commit behind apploader.img
        run: |
          set -e
          SWISS="$(cat apploader.swiss-commit)"
          echo "swiss-gc packer commit: $SWISS"
          echo "SWISS_COMMIT=$SWISS" >> "$GITHUB_ENV"
          echo "\`apploader.img\` embeds the swiss-gc packer at [\`${SWISS:0:7}\`](https://github.com/emukidid/swiss-gc/commit/$SWISS)." >> "$GITHUB_STEP_SUMMARY"

      # cubiboot.iso: bootable GameCube disc image for GC Loader (El-Torito ISO9660
      # built from cubeboot-tools' gbi.hdr re-branded to the Cubiboot banner + the
      # freshly built cubeboot loader .dol). Also writes cubiboot-noipl.iso (same disc,
      # no-animation boot header) for the PicoLoader uf2 step below.
      - name: Build cubiboot.iso
        run: docker run --rm -v "$PWD":/work cubiboot-dev bash -lc 'bash /work/.ci/build_iso.sh'

      - name: Assemble release files
        run: |
          set -e
          mkdir -p dist/swiss/patches
          cp cubeboot/cubeboot.dol dist/ipl.dol
          # Same binary again for FlippyDrive owners, who flash it into the drive rather
          # than putting it on a card. Named for the device rather than for the filename the
          # drive wants: shipping it as cubeboot.dol would be indistinguishable from upstream
          # cubeboot's own loader, and from ipl.dol, in a release listing. The rename to
          # cubeboot.dol is step 1 of Method 4 in the README.
          cp cubeboot/cubeboot.dol dist/flippydrive.dol
          cp apploader.img         dist/swiss/patches/apploader.img
          cp cubiboot.iso          dist/cubiboot.iso
          # config.ini ships from .ci/config.ini so the template users receive is a real
          # file that can be read and diffed, not an escaped one-liner kept in sync by hand.
          cp .ci/config.ini dist/config.ini
          # EXTRACT_TO_ROOT.zip: extract to the SD card root (ipl.dol + config.ini + apploader.img)
          (cd dist && zip -r ../EXTRACT_TO_ROOT.zip ipl.dol config.ini swiss)
          cp EXTRACT_TO_ROOT.zip dist/EXTRACT_TO_ROOT.zip
          ls -la dist dist/swiss/patches

      # cubiboot_picoloader_payload.uf2: PicoLoader firmware with cubiboot embedded as
      # the payload (replicates makeo's PicoLoader converter). Flash directly to the Pico.
      # Uses cubiboot-noipl.iso — same disc as cubiboot.iso, but its boot header's
      # apploader (.ci/noipl/) suppresses the stock IPL animation, so the console shows a
      # single boot animation instead of two. Only this uf2 consumes that iso; every
      # other artifact, cubiboot.iso included, is untouched by it.
      - name: Build cubiboot_picoloader_payload.uf2
        run: |
          set -e
          curl -fsSL -o picoloader.uf2 https://makeo.github.io/PicoLoader/fw/picoloader.uf2
          python3 .ci/make_picoloader_uf2.py picoloader.uf2 cubiboot-noipl.iso dist/cubiboot_picoloader_payload.uf2
          ls -la dist/cubiboot_picoloader_payload.uf2

      # cubiboot_picoboot_payload.uf2: payload-only update for PicoBoot (webhdx). The
      # payload is entry/entry.dol — the stage-1 stub linked at 0x81300000, the only DOL
      # PicoBoot can inject — scrambled like BS2 ROM and written at flash 0x80000, where
      # official PicoBoot firmware >= v0.4 (Pico 2: >= v0.5.0) streams it from. Users
      # flash the official picoboot_full_*.uf2 once, then this on top; it replaces the
      # stock gekkoboot payload in place. See .ci/make_picoboot_uf2.py.
      - name: Build cubiboot_picoboot_payload.uf2
        run: |
          set -e
          python3 .ci/make_picoboot_uf2.py entry/entry.dol dist/
          ls -la dist/cubiboot_picoboot_payload.uf2

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cubiboot
          path: |
            dist/ipl.dol
            dist/flippydrive.dol
            dist/swiss/patches/apploader.img
            dist/config.ini
            dist/cubiboot.iso
            dist/cubiboot_picoloader_payload.uf2
            dist/cubiboot_picoboot_payload.uf2
            dist/EXTRACT_TO_ROOT.zip

      # On a tag push (v*), publish a GitHub Release with the artifacts.
      #
      # The body comes from .ci/release-notes.md, written per release. It used to be
      # generate_release_notes, which builds the body out of the commit log -- that buries
      # what actually changed under every "chore: refresh the banner artwork", and adds
      # contributor and PR lists nobody asked for. It also silently ignores the tag's own
      # annotation, so writing notes there does nothing.
      # The body is .ci/release-notes.md plus one generated provenance line: the
      # swiss-gc commit apploader.img embeds and the toolchain image that built
      # everything. It goes in before the standing ">>" block, which that file
      # requires to stay last; the file itself is not modified.
      - name: Release notes with build provenance
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          LINE="**Build:** \`apploader.img\` embeds the swiss-gc packer at [\`${SWISS_COMMIT:0:7}\`](https://github.com/emukidid/swiss-gc/commit/$SWISS_COMMIT)"
          IMAGE="$(sed -n 's/^image=//p' .ci/toolchain.digest 2>/dev/null || true)"
          if [ -n "$IMAGE" ]; then
            LINE="$LINE; built with toolchain image \`$(printf '%s' "${IMAGE#*@}" | cut -c1-19)\`"
          fi
          LINE="$LINE."
          LINE="$LINE" awk '
            !done && /^>>/ { print ENVIRON["LINE"]; print ""; done = 1 }
            { print }
            END { if (!done) { print ""; print ENVIRON["LINE"] } }
          ' .ci/release-notes.md > release-body.md
          echo "--- release body, last lines:"; tail -n 6 release-body.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            dist/ipl.dol
            dist/flippydrive.dol
            dist/swiss/patches/apploader.img
            dist/config.ini
            dist/cubiboot.iso
            dist/cubiboot_picoloader_payload.uf2
            dist/cubiboot_picoboot_payload.uf2
            dist/EXTRACT_TO_ROOT.zip
