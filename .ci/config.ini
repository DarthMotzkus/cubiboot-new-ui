; cubiboot configuration.
;
; This is the file shipped in every release and inside EXTRACT_TO_ROOT.zip. Put it in the
; root of the card cubiboot reads from. Everything here is optional -- delete the file and
; you get the defaults below.
;
; Lines starting with ';' are comments. Full reference: docs/settings.md

[cubeboot]


; ---------------------------------------------------------------------------------------
; Menu
; ---------------------------------------------------------------------------------------

; Grid layout of the game list.
;   small_banners = small banners, 4 columns  (default)
;   banners       = large banners, 3 columns
;   square_icons  = square icons, 8 columns
; Use square_icons for folders with more than 128 files -- the banner layouts get slow and
; can crash past that. See "Large folders and the banner pool" in the README.
menu_grid_type = small_banners

; Folder the menu opens in at startup. Leave commented for the card root. Only affects
; where games are browsed; ipl.dol, config.ini and swiss-gc.dol stay at the root.
; default_folder = /games

; Pre-select the last game you booted, so the next boot is just pressing A. Requires
; Swiss's Recent List to be On -- cubiboot reads Swiss's own recent.ini, it writes nothing.
; Overrides default_folder once you have played something.
remember_last_game = 0


; ---------------------------------------------------------------------------------------
; Storage
; ---------------------------------------------------------------------------------------

; Which storage to read games from, most wanted first. The first entry that mounts holds
; everything: swiss-gc.dol, the games, and ipl.bin if you use one.
;   sd2sp2 = SD2SP2 (serial port 2)          -- FatFs name: sdc
;   slot_b = memory card slot B (SD Gecko)   -- FatFs name: sdb
;   slot_a = memory card slot A (SD Gecko)   -- FatFs name: sda
;   ode    = the card inside a GC Loader     -- FatFs name: gcldr  (alias: gcloader)
; Leaving a device out is how you keep cubiboot off it; there is no on/off switch.
; A console with both an SD2SP2 and a GC Loader, whose games live on the ODE, wants:
;   device_order = ode
; config.ini itself is looked for on every device in the default order below, so it works
; wherever you put it.
; device_order = sd2sp2, slot_b, slot_a, ode


; ---------------------------------------------------------------------------------------
; Colors
; ---------------------------------------------------------------------------------------

; Every color takes a hex RGB code, or `random` to re-roll on each boot (random seeds from
; the console clock, so a dead RTC battery keeps landing on the same one).
; theme_color paints everything; the keys under it override it per item.
; Leave them all commented for the stock look.

; theme_color = ff9801

; cube_color = ff9801        ; the boot logo cube only
; menu_cube_color = 8b5cd6   ; grid cubes -- or a stock palette name:
;                            ; blue | green | yellow | orange | red | purple (default)
; menu_box_color = 6e00b3    ; info panel under the game list
; menu_start_color = ff2d55  ; the big block PRESS START on the pre-boot screen


; ---------------------------------------------------------------------------------------
; Video
; ---------------------------------------------------------------------------------------

; Render the menu anamorphic for a 16:9 TV. The picture is squeezed horizontally so it
; looks right once the TV stretches it -- set the TV (or GCVideo) to Full/16:9. On a 4:3
; screen it just looks squeezed. Costs some horizontal resolution.
; force_widescreen = 0


; ---------------------------------------------------------------------------------------
; Boot delays
; ---------------------------------------------------------------------------------------

; Milliseconds to hold still before the boot animation starts -- use it to give a TV or
; GCVideo time to lock onto the signal before there is anything worth seeing.
; preboot_delay_ms = 0

; Milliseconds to keep the last frame on screen after you pick a game, before it boots.
; Pure flair: it recovers the feeling of waiting for a disc to spin up.
; postboot_delay_ms = 0
